# Posts grouped patch notes to Discord when a new build is LIVE on Pages.
#
# Triggered on `deployment_status`, not `push`: a push only means the code was
# committed, and the site isn't reachable until Pages finishes building. This
# fires when it is actually playable.
#
# All the logic lives in .github/scripts/patch_notes.py - keeping it out of the
# YAML avoids nesting a heredoc inside a block scalar, which silently breaks
# the file, and makes the script runnable by hand for testing.
#
# SETUP (one time):
#   1. Discord: Server Settings > Integrations > Webhooks > New Webhook,
#      pick a channel, "Copy Webhook URL".
#   2. GitHub: Settings > Secrets and variables > Actions > New repository
#      secret, named exactly DISCORD_WEBHOOK, paste the URL.

name: Announce deploy to Discord

on:
  deployment_status:

jobs:
  notify:
    # deployment_status fires for every state change (queued/in_progress/
    # success/failure). Only announce real successes.
    if: github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: read

    steps:
      # Full history: the script diffs against whatever was previously deployed.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Post patch notes to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          GITHUB_TOKEN: ${{ github.token }}
          PAGE_URL: ${{ github.event.deployment_status.environment_url }}
          ENVIRONMENT: ${{ github.event.deployment_status.environment }}
        run: python3 .github/scripts/patch_notes.py
